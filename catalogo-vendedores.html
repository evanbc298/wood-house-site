<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#FFF5E3;--s:#FFFDF8;--t1:#5C1A00;--t2:#9A7A5C;--ac:#CDA96C;--bd:#E7D6B8;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);}
img{max-width:100%;display:block;}
header{display:flex;align-items:center;justify-content:center;padding:20px;background:var(--s);border-bottom:1px solid var(--bd);}
header img{height:32px;}
.wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em;}
.sub{font-size:14px;color:var(--t2);margin-bottom:26px;max-width:560px;line-height:1.5;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.tab{font-size:13px;font-weight:700;letter-spacing:.02em;padding:10px 20px;border-radius:30px;border:1.5px solid var(--bd);background:var(--s);color:var(--t2);cursor:pointer;transition:all .15s;}
.tab.active{background:var(--t1);color:#FBF6EE;border-color:var(--t1);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.card{background:var(--s);border:1px solid var(--bd);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--t1);transition:transform .15s,box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(92,26,0,.12);}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bd);}
.card-body{padding:12px 14px 14px;}
.card-name{font-size:15px;font-weight:800;margin-bottom:3px;}
.card-meta{font-size:12px;color:var(--t2);margin-bottom:8px;}
.card-price{font-size:16px;font-weight:800;color:var(--t1);}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--t2);font-size:14px;line-height:1.6;}
footer{text-align:center;padding:20px;font-size:11px;color:var(--t2);}
@media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:900px){ .grid{grid-template-columns:repeat(4,1fr);} }
</style>
</head>
