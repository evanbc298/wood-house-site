<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de investimento — Wood House</title>
<meta name="description" content="Catálogo de modelos com investimento, planta e fotos — link direto pra enviar ao cliente.">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#FFF5E3;--s:#FFFDF8;--t1:#5C1A00;--t2:#9A7A5C;--ac:#CDA96C;--bd:#E7D6B8;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--t1);}
img{max-width:100%;display:block;}
header{display:flex;align-items:center;justify-content:center;padding:20px;background:var(--s);border-bottom:1px solid var(--bd);}
header img{height:88px;}
.wrap{max-width:1100px;margin:0 auto;padding:30px 20px 60px;}
h1{font-size:26px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em;}
.sub{font-size:14px;color:var(--t2);margin-bottom:26px;max-width:560px;line-height:1.5;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.tab{font-size:13px;font-weight:700;letter-spacing:.02em;padding:10px 20px;border-radius:30px;border:1.5px solid var(--bd);background:var(--s);color:var(--t2);cursor:pointer;transition:all .15s;}
.tab.active{background:var(--t1);color:#FBF6EE;border-color:var(--t1);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.card{background:var(--s);border:1px solid var(--bd);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--t1);transition:transform .15s,box-shadow .15s;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(92,26,0,.12);}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bd);}
.card-body{padding:12px 14px 14px;}
.card-name{font-size:15px;font-weight:800;margin-bottom:3px;}
.card-meta{font-size:12px;color:var(--t2);margin-bottom:8px;}
.card-price{font-size:16px;font-weight:800;color:var(--t1);}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--t2);font-size:14px;line-height:1.6;}
.upsell{margin-top:44px;padding-top:32px;border-top:1px solid var(--bd);}
.upsell-head{margin-bottom:16px;}
.upsell-title{font-size:17px;font-weight:800;margin-bottom:4px;}
.upsell-sub{font-size:13px;color:var(--t2);}
.upsell-cta{display:inline-block;margin-top:18px;padding:12px 24px;border-radius:30px;background:var(--t1);color:#FBF6EE;text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.02em;}
footer{text-align:center;padding:20px;font-size:11px;color:var(--t2);}
.watermark-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;background-repeat:repeat;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='480'><text x='0' y='260' font-family='Arial, Helvetica, sans-serif' font-weight='700' font-size='20' letter-spacing='3' fill='%235C1A00' fill-opacity='0.035' transform='rotate(-28 300 240)'>WOOD HOUSE</text></svg>");}
@media (min-width:640px){ .grid{grid-template-columns:repeat(3,1fr);} }
@media (min-width:900px){ .grid{grid-template-columns:repeat(4,1fr);} }
</style>
</head>

  <p class="sub">Bem-vindo(a) ao catálogo Wood House. Aqui você encontra nossos modelos com fotos, planta baixa e investimento detalhado.</p>
  <div class="tabs">
    <button class="tab active" data-f="2">2 Dormitórios</button>
    <button class="tab" data-f="3">3 Dormitórios</button>
    <button class="tab" data-f="4">4 Dormitórios</button>
    <button class="tab" data-f="ranchos">Ranchos e Celeiros</button>
    <button class="tab" data-f="chales">Chalés</button>
    <button class="tab" data-f="all">Todos</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="upsell" id="upsell" style="display:none;">
    <div class="upsell-head">
      <div class="upsell-title">Conheça também</div>
      <div class="upsell-sub">Outros estilos do catálogo Wood House.</div>
    </div>
    <div class="grid" id="upsell-grid"></div>
    <a class="upsell-cta" id="upsell-cta" href="catalogo-vendedores.html?f=all">Ver catálogo completo →</a>
  </div>
</div>

const grid = document.getElementById('grid');
const tabs = document.querySelectorAll('.tab');
const upsell = document.getElementById('upsell');
const upsellGrid = document.getElementById('upsell-grid');
const byId = id => modelos.find(m => m.id === id);

const TEASER_POOL = [
  { id: 'rancho-barndominium-sobrado', bucket: 'ranchos' },
  { id: 'chale-vertice', bucket: 'chales' },
  { id: 'istambul', bucket: '4' },
  { id: 'sergipe', bucket: '3' },
  { id: 'melita', bucket: '2' },
];

function cardHtml(m) {
  return `
    <a class="card" href="${m.href || 'vendas.html?m=' + m.id}">
      <img src="${m.img || 'assets/modelos/' + m.id + '-1.jpg'}" alt="${m.nome}" loading="lazy" onerror="this.style.background='var(--bd)'">
      <div class="card-body">
        <div class="card-name">${m.nome}</div>
        <div class="card-meta">${m.area} · ${m.dorms} dorm.</div>
        <div class="card-price">${m.valor}</div>
      </div>
    </a>`;
}

function render(filter) {
  const list = filter === 'all' ? modelos
    : filter === 'ranchos' ? modelos.filter(m => m.cat === 'ranchos')
    : filter === 'chales' ? modelos.filter(m => m.cat === 'chales')
    : modelos.filter(m => String(m.dorms) === filter && !m.cat);
  grid.innerHTML = list.map(cardHtml).join('');

  if (filter === 'all') {
    upsell.style.display = 'none';
  } else {
    const teasers = TEASER_POOL.filter(t => t.bucket !== filter).map(t => byId(t.id)).filter(Boolean);
    upsellGrid.innerHTML = teasers.map(cardHtml).join('');
    upsell.style.display = teasers.length ? 'block' : 'none';
  }
}

const VALID_FILTERS = ['2', '3', '4', 'ranchos', 'chales', 'all'];

function setActiveTab(filter) {
  tabs.forEach(x => x.classList.toggle('active', x.dataset.f === filter));
}

tabs.forEach(t => t.addEventListener('click', () => {
  setActiveTab(t.dataset.f);
  render(t.dataset.f);
  history.replaceState(null, '', '?f=' + t.dataset.f);
}));

const urlFilter = new URLSearchParams(location.search).get('f');
const startFilter = VALID_FILTERS.includes(urlFilter) ? urlFilter : '2';
setActiveTab(startFilter);
render(startFilter);
